<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tesser Watchtower</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #00ff41;
            --panel-bg: #1a1a1a;
            --alert-color: #ff0055;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            text-shadow: 0 0 10px var(--text-color);
            margin-bottom: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 80%;
            max-width: 800px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--text-color);
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            border-radius: 5px;
        }

        .stat-label {
            font-size: 0.8em;
            color: #888;
            display: block;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .regs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .reg-box {
            border: 1px solid #333;
            padding: 5px;
            text-align: center;
        }

        .reg-name {
            font-size: 0.7em;
            color: #aaa;
        }

        .aes-container {
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            margin-top: 5px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--text-color);
            transition: width 0.2s ease;
            box-shadow: 0 0 10px var(--text-color);
        }

        .status-ready .progress-fill {
            background: var(--text-color);
            width: 100%;
        }

        .status-busy .progress-fill {
            background: var(--alert-color);
            width: 50%;
            /* Fake animation state or based on detailed telemetry */
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <h1>TESSER WATCHTOWER // v0.1</h1>

    <div class="dashboard">
        <!-- CPU Core -->
        <div class="panel">
            <span class="stat-label">PROGRAM COUNTER</span>
            <span id="pc-val" class="stat-value">0x0000</span>

            <hr style="border-color: #333; margin: 15px 0;">

            <div class="regs-grid" id="regs-container">
                <!-- Regs generated by JS -->
            </div>
        </div>

        <!-- Peripherals -->
        <div class="panel">
            <span class="stat-label">AES ACCELERATOR</span>
            <div class="aes-container">
                <span id="aes-status-text">IDLE</span>
                <div class="progress-bar" id="aes-bar">
                    <div class="progress-fill" id="aes-fill"></div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <span class="stat-label">SYSTEM LOG</span>
                <div id="log-box"
                    style="height: 100px; overflow-y: auto; font-size: 0.8em; border-top: 1px solid #333; padding-top:5px;">
                    Connecting...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Init Registers Visualization
        const regContainer = document.getElementById('regs-container');
        for (let i = 0; i < 16; i++) {
            const div = document.createElement('div');
            div.className = 'reg-box';
            div.innerHTML = `<div class="reg-name">R${i}</div><div id="reg-${i}">00</div>`;
            regContainer.appendChild(div);
        }

        const socket = new WebSocket('ws://localhost:8080');
        const logBox = document.getElementById('log-box');

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            logBox.prepend(div);
            if (logBox.childNodes.length > 10) logBox.removeChild(logBox.lastChild);
        }

        socket.onopen = () => {
            log("Uplink Established.");
        };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.msg) {
                    log(data.msg);
                    return;
                }

                // Update PC
                document.getElementById('pc-val').textContent = "0x" + data.pc.toString(16).toUpperCase().padStart(4, '0');

                // Update Regs
                if (data.regs) {
                    data.regs.forEach((val, idx) => {
                        const el = document.getElementById(`reg-${idx}`);
                        if (el) el.textContent = val.toString(16).toUpperCase().padStart(2, '0');
                    });
                }

                // Update AES
                const aesStatus = data.aes_status || "IDLE";
                document.getElementById('aes-status-text').textContent = aesStatus;
                const aesFill = document.getElementById('aes-fill');
                const aesBar = document.getElementById('aes-bar');

                aesBar.className = "progress-bar " + (aesStatus.includes("READY") ? "status-ready" : "status-busy");

            } catch (e) {
                console.error("Parse error", e);
            }
        };

        socket.onclose = () => {
            log("Connection Lost.");
        };
    </script>
</body>

</html>
