<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TESSER WATCHTOWER v2.0</title>
    <style>
        :root {
            --bg-color: #050505;
            --grid-color: #1a1a1a;
            --accent-color: #00ff41;
            --stack-active: #00ff41;
            --stack-empty: #222;
            --text-color: #e0e0e0;
            --highlight: #ff0055;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', 'Monaco', monospace;
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Layout Grid */
        .container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            width: 100%;
            gap: 2px;
            background-color: var(--grid-color);
        }

        .panel {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        /* --- STACK VISUALIZATION (Central) --- */
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            /* Bottom fills up */
            height: 100%;
            justify-content: flex-start;
            gap: 5px;
            padding: 20px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px dashed #333;
        }

        .stack-slot {
            height: 40px;
            background: var(--stack-empty);
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 1.1rem;
            color: #555;
            transition: all 0.2s ease;
        }

        .stack-slot.active {
            background: rgba(0, 255, 65, 0.2);
            border-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
            font-weight: bold;
        }

        .stack-idx {
            font-size: 0.8rem;
            color: #444;
        }

        /* --- HARDWARE PANEL (Right) --- */
        .hw-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .servo-card {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .servo-card.active {
            border-color: var(--highlight);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .servo-val {
            font-size: 1.5rem;
            color: var(--highlight);
            display: block;
            margin-top: 5px;
        }

        .servo-label {
            font-size: 0.8rem;
            color: #aaa;
        }

        /* --- INFO PANEL (Left) --- */
        .stat-box {
            margin-bottom: 20px;
        }

        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }

        .stat-val-huge {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
        }

        .log-box {
            flex-grow: 1;
            border-top: 1px solid #333;
            margin-top: auto;
            font-size: 0.8rem;
            color: #666;
            overflow-y: auto;
            padding-top: 10px;
        }

        /* Scanline effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="scanlines"></div>

    <div class="container">
        <!-- LEFT: SYSTEM INFO -->
        <div class="panel">
            <h2>System Status</h2>

            <div class="stat-box">
                <span class="stat-label">PROGRAM COUNTER</span>
                <div id="pc-val" class="stat-value stat-val-huge">0x0000</div>
            </div>

            <div class="stat-box">
                <span class="stat-label">STACK POINTER</span>
                <div id="sp-val" class="stat-value" style="font-size: 2rem;">0</div>
            </div>

            <div class="stat-box">
                <span class="stat-label">CPU STATE</span>
                <div style="color: var(--accent-color);">RUNNING</div>
            </div>

            <div class="log-box" id="sys-log">
                > System Initialized...<br>
                > Waiting for Uplink...
            </div>
        </div>

        <!-- CENTER: STACK VISUALIZATION -->
        <div class="panel">
            <h2>Hardware Stack (LIFO)</h2>
            <div class="stack-container" id="stack-view">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- RIGHT: PERIPHERALS -->
        <div class="panel">
            <h2>MUI Bus Output</h2>
            <div class="hw-grid">
                <!-- Servo 0 -->
                <div class="servo-card" id="servo-0">
                    <span class="servo-label">MUI ID #0</span>
                    <span class="servo-val" id="val-0">---</span>
                </div>
                <!-- Servo 1 -->
                <div class="servo-card" id="servo-1">
                    <span class="servo-label">MUI ID #1</span>
                    <span class="servo-val" id="val-1">---</span>
                </div>
                <!-- Servo 50 (Exemplo) -->
                <div class="servo-card" id="servo-50">
                    <span class="servo-label">SMOOTH #50</span>
                    <span class="servo-val" id="val-50">---</span>
                </div>
            </div>

            <div style="margin-top: 30px; border: 1px solid #333; padding: 10px;">
                <span class="stat-label">RAW TELEMETRY</span>
                <div id="raw-json" style="font-size: 0.7rem; color: #555; word-wrap: break-word;"></div>
            </div>
        </div>
    </div>

    <script>
        const stackView = document.getElementById('stack-view');

        // Init 16 Stack Slots
        for (let i = 0; i < 16; i++) {
            const slot = document.createElement('div');
            slot.className = 'stack-slot';
            slot.id = `stack-${i}`;
            slot.innerHTML = `<span class="stack-idx">${i}</span><span class="val">---</span>`;
            // Prepend because flex-direction is column-reverse (0 is bottom)
            stackView.prepend(slot);
            // Wait, column-reverse makes 'prepend' put it at bottom? 
            // Standard: append 0, append 1. 
            // Reverse: 0 is bottom, 1 is above it.
            // So we loop 0..15 and APPEND.
        }
        // Fix: clear and append correctly
        stackView.innerHTML = '';
        for (let i = 0; i < 16; i++) {
            const slot = document.createElement('div');
            slot.className = 'stack-slot';
            slot.id = `stack-${i}`;
            slot.innerHTML = `<span class="stack-idx">${i}</span><span class="val">EMPTY</span>`;
            stackView.appendChild(slot);
        }

        const socket = new WebSocket('ws://localhost:8080');

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.msg) return;

                // 1. Update PC & SP
                document.getElementById('pc-val').textContent = "0x" + data.pc.toString(16).toUpperCase().padStart(4, '0');
                document.getElementById('sp-val').textContent = data.sp;
                document.getElementById('raw-json').textContent = JSON.stringify(data);

                // 2. Render Stack
                for (let i = 0; i < 16; i++) {
                    const el = document.getElementById(`stack-${i}`);
                    const valEl = el.querySelector('.val');

                    if (i < data.sp) { // Stack slot is used
                        el.classList.add('active');
                        // Safe access data.stack[i]
                        const val = data.stack[i];
                        valEl.textContent = val + ` (0x${val.toString(16).toUpperCase()})`;
                    } else {
                        el.classList.remove('active');
                        valEl.textContent = "EMPTY";
                    }
                }

                // 3. Update Peripherals (Visual Flash)
                if (data.mui_last_id !== -1) {
                    const id = data.mui_last_id;
                    const val = data.mui_last_val;

                    // Update specific cards if they exist
                    let card = document.getElementById(`servo-${id}`);
                    if (!card) {
                        // Dynamic create would be cool, but fixed for now
                        // Log to sys
                        // document.getElementById('sys-log').innerHTML += `> MUI[${id}] set to ${val}<br>`;
                    } else {
                        document.getElementById(`val-${id}`).textContent = val;

                        // Flash effect
                        card.classList.add('active');
                        setTimeout(() => card.classList.remove('active'), 200);
                    }
                }

            } catch (e) {
                console.error(e);
            }
        };
    </script>
</body>

</html>
