<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TESSER WATCHTOWER v2.0</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #00ff41;
            --grid-color: #333;
            --inactive-color: #222;
            --active-bg: rgba(0, 255, 65, 0.2);
            --highlight: #ff0055;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', monospace;
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 100%;
            height: 100%;
            gap: 1px;
            background-color: var(--grid-color);
        }

        .panel {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--grid-color);
        }

        h2 {
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 10px;
            margin-top: 0;
            text-transform: uppercase;
        }

        /* COL 1: CPU */
        .metric {
            margin-bottom: 20px;
        }

        .metric-val {
            font-size: 3em;
            font-weight: bold;
        }

        /* COL 2: STACK */
        .stack-wrapper {
            display: flex;
            flex-direction: column-reverse;
            /* Bottom is 0 */
            height: 100%;
            gap: 2px;
            justify-content: start;
        }

        .stack-block {
            height: 6%;
            background: var(--inactive-color);
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            color: #555;
            transition: 0.1s;
        }

        .stack-block.active {
            background: var(--active-bg);
            border-color: var(--text-color);
            color: #fff;
            box-shadow: 0 0 10px var(--active-bg);
        }

        /* COL 3: HARDWARE */
        .hw-indicator {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #222;
            margin: 20px auto;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px #000;
        }

        .hw-indicator.on {
            background: var(--highlight);
            box-shadow: 0 0 30px var(--highlight);
            border-color: #fff;
            color: #fff;
            font-weight: bold;
        }

        .io-log {
            font-size: 0.8em;
            color: #888;
            margin-top: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- COL 1: CPU STATUS -->
        <div class="panel">
            <h2>CPU Core</h2>
            <div class="metric">
                <div>PROGRAM COUNTER</div>
                <div id="pc-val" class="metric-val">0000</div>
            </div>
            <div class="metric">
                <div>STACK POINTER</div>
                <div id="sp-val" class="metric-val">0</div>
            </div>
            <div style="margin-top:50px; color: #555;">
                STATUS: <span style="color:var(--text-color)">RUNNING</span>
            </div>
        </div>

        <!-- COL 2: THE STACK -->
        <div class="panel">
            <h2>Stack Memory</h2>
            <div class="stack-wrapper" id="stack-container">
                <!-- Stack blocks generated by JS -->
            </div>
        </div>

        <!-- COL 3: HARDWARE IO -->
        <div class="panel">
            <h2>MUI Output</h2>
            <div style="text-align:center; margin-top: 20px;">
                <div>ACTUATOR ID 0 (LED)</div>
                <div id="led-indicator" class="hw-indicator">OFF</div>
            </div>

            <div class="metric" style="text-align:center;">
                <div>LAST COMMAND</div>
                <div id="io-cmd" style="font-size: 1.5em; color: var(--highlight);">ID: - | Val: -</div>
            </div>

            <div class="io-log" id="conn-status">Waiting for link...</div>
        </div>
    </div>

    <script>
        // Init Stack UI
        const stackContainer = document.querySelector('#stack-container');
        for (let i = 0; i < 16; i++) {
            const div = document.createElement('div');
            div.className = 'stack-block';
            div.id = `stack-${i}`;
            div.innerHTML = `<span>${i}</span><span class="val">--</span>`;
            stackContainer.appendChild(div); // Appends to bottom (reversed by flex)
        }

        const socket = new WebSocket('ws://localhost:8080');
        const connStatus = document.getElementById('conn-status');

        socket.onopen = () => connStatus.innerText = "LINK ESTABLISHED";
        socket.onclose = () => connStatus.innerText = "LINK LOST";

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.msg) return;

                // 1. Update CPU
                document.getElementById('pc-val').innerText = data.pc;
                document.getElementById('sp-val').innerText = data.sp;

                // 2. Update Stack
                for (let i = 0; i < 16; i++) {
                    const block = document.getElementById(`stack-${i}`);
                    const valSpan = block.querySelector('.val');

                    if (i < data.sp) {
                        block.classList.add('active');
                        valSpan.innerText = data.stack[i];
                    } else {
                        block.classList.remove('active');
                        valSpan.innerText = "--";
                    }
                }

                // 3. Update Hardware
                const ioText = `ID: ${data.mui_id} | Val: ${data.mui_val}`;
                document.getElementById('io-cmd').innerText = ioText;

                // LED Logic (ID 0)
                const led = document.getElementById('led-indicator');
                if (data.mui_id === 0 && data.mui_val > 0) {
                    led.classList.add('on');
                    led.innerText = "ON";
                } else if (data.mui_id === 0 && data.mui_val === 0) {
                    led.classList.remove('on');
                    led.innerText = "OFF";
                }

            } catch (e) {
                console.error("Data error", e);
            }
        };
    </script>
</body>

</html>
